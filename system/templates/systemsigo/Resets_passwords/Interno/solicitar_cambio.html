{% extends "systemsigo/base.html" %}
{% load static %}

{% block content %}

<div class="card p-4">
    <p class="text-center mb-2"  style="font-size: 18px;">Escribe la contraseña actual</p>
    <hr class="text-center" style="color: var(--color-uacam-primary);">
    <form method="POST" class="mt-3">
        {% csrf_token %}
        <div class="material-input">
            <input type="password" name="actual" id="password-input" required>
            <label>Contraseña actual</label>
            <button type="button" class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent"
                    onclick="togglePasswordVisibility()">
                <i id="password-icon" class="bi bi-eye-slash" style="color: var(--color-uacam-black);"></i>
            </button>
        </div>

        <div class="d-grid gap-2 mx-auto justify-content-center align-items-center">
            <button type="submit" class="btn-uacam-primary-especial">Solicitar código</button>
            <a href="{% url 'perfil_usuario' %}" class="btn btn-danger">Cancelar</a>
        </div>
    </form>
</div>

<script>
function togglePasswordVisibility() {
    const input = document.getElementById('password-input');
    const icon = document.getElementById('password-icon');

    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    
    icon.classList.toggle('bi-eye');
    icon.classList.toggle('bi-eye-slash');
}
</script>

{% endblock content %}
