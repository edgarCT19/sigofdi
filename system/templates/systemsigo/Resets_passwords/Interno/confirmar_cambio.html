{% extends "systemsigo/base.html" %}
{% load static %}

{% block content %}

<div class="card p-4">
    <p class="text-center mb-2" style="font-size: 18px;">Restaura tu contraseña</p>
    <hr class="text-center" style="color: var(--color-uacam-primary);">

    <form method="POST" class="mt-3">
        {% csrf_token %}

        <div class="material-input">
            <input type="text" name="codigo" required>
            <label>Código recibido por correo</label>
        </div>

        <div class="material-input">
            <input type="password" name="nueva" required>
            <label>Nueva contraseña</label>

            <button type="button"
                    class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent"
                    onclick="togglePasswordVisibility(this)">
                <i class="bi bi-eye-slash" style="color: var(--color-uacam-black);"></i>
            </button>
        </div>

        <div class="material-input">
            <input type="password" name="confirmar" required>
            <label>Confirmar nueva contraseña</label>

            <button type="button"
                    class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent"
                    onclick="togglePasswordVisibility(this)">
                <i class="bi bi-eye-slash" style="color: var(--color-uacam-black);"></i>
            </button>
        </div>

        <div class="d-flex justify-content-center align-items-center">
            <button type="submit" class="btn-uacam-primary-especial">
                Cambiar contraseña
            </button>
        </div>
    </form>
</div>

<script>
function togglePasswordVisibility(button) {
    const input = button.closest('.material-input').querySelector('input');
    const icon = button.querySelector('i');

    if (!input) return;

    input.type = input.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('bi-eye');
    icon.classList.toggle('bi-eye-slash');
}
</script>

{% endblock content %}
